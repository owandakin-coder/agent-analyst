name: Execution Queue Poller

# ──────────────────────────────────────────────────────────────
# Replaces the Render background worker (atzma-worker), which Render's
# current workspace plans no longer let this account create for free —
# background workers now require a paid compute tier. This repo is public,
# so GitHub Actions minutes are free and unbounded, and user_execution_worker.py
# already has a --poll-once CLI mode built for exactly this: claim and run at
# most one queued execution_request, then exit.
#
# GitHub's scheduled triggers have a 5-minute floor (and can slip further
# under load), so this can't match a real always-on worker's ~10-second
# responsiveness — a job may sit queued for a few minutes before a run picks
# it up. To reduce that within the 5-minute window rather than only at its
# edges, each run loops --poll-once for up to ~4 minutes (draining anything
# that's queued) before exiting, leaving headroom before the next schedule.
#
# In practice the `schedule:` trigger runs far less often than its cron
# implies: measured over 35 runs on 2026-09-23, the median gap between
# scheduled runs was ~3.5 hours (max ~6.8 hours), not 5 minutes — GitHub
# gives `schedule` events low priority on public repos, and that's a
# platform limitation, not something fixable in this file's cron line. A
# multi-hour gap here means queued trade executions sit unprocessed for
# hours, so the poller now re-triggers itself via `workflow_dispatch` as
# its real heartbeat (that event type isn't subject to the same low-
# priority queue) and keeps `schedule:` only as an independent backstop in
# case the self-chain ever breaks. `concurrency:` below ensures the chain
# and the backstop can never fan out into parallel runs.
# ──────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: execution-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate worker configuration
        env:
          ATZMA_WORKER_SHARED_TOKEN: ${{ secrets.ATZMA_WORKER_SHARED_TOKEN }}
        run: |
          if [ -z "$ATZMA_WORKER_SHARED_TOKEN" ]; then
            echo "::error::ATZMA_WORKER_SHARED_TOKEN is not set as a GitHub Actions secret (empty). Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Never print the value — just enough to compare against what's
          # actually saved in Supabase without exposing either one. Compute
          # the same sha256sum(printf '%s' "$TOKEN") locally against your own
          # copy of the value to confirm the two sides genuinely match,
          # instead of eyeballing a copy-paste.
          len=${#ATZMA_WORKER_SHARED_TOKEN}
          hash=$(printf '%s' "$ATZMA_WORKER_SHARED_TOKEN" | sha256sum | cut -c1-12)
          echo "ATZMA_WORKER_SHARED_TOKEN is set: length=$len sha256[0:12]=$hash"

      - name: Drain the execution queue for up to 4 minutes
        env:
          ATZMA_REMOTE_API_BASE: https://sofowpweliticltlbxrj.supabase.co/functions/v1/api
          ATZMA_WORKER_SHARED_TOKEN: ${{ secrets.ATZMA_WORKER_SHARED_TOKEN }}
          ATZMA_WORKER_ID: github-actions-poller
          ATZMA_FAIL_CLOSED_CONTROL: "1"
          ATZMA_REQUIRE_FRESH_QUOTES: "1"
          ATZMA_JSON_LOGS: "1"
        run: |
          # `run:` steps use `bash -e` by default, so a single failed poll
          # (401 from a bad token, a transient network blip, ...) would kill
          # the whole step on its first iteration instead of retrying for
          # the full window — `|| true` swallows that so the loop keeps
          # going. A job that WAS claimed still reports its own success or
          # failure to the backend via /worker/execution/complete regardless.
          #
          # But tolerating individual failures must not turn into silently
          # reporting green when EVERY attempt in the window failed (e.g. a
          # bad/mismatched ATZMA_WORKER_SHARED_TOKEN, seen 2026-09-17: every
          # single poll got 401'd for the full 4 minutes, yet the step still
          # showed success because nothing ever propagated that). Track the
          # attempt/failure counts and fail the step if 100% of attempts
          # failed, so a systemic auth/connectivity problem shows up as a
          # red X instead of hiding behind "the loop didn't crash".
          end=$((SECONDS + 240))
          attempts=0
          failures=0
          while [ $SECONDS -lt $end ]; do
            attempts=$((attempts + 1))
            if ! python user_execution_worker.py --poll-once --worker-id "$ATZMA_WORKER_ID"; then
              failures=$((failures + 1))
              echo "::warning::poll-once attempt $attempts failed (see log above) — retrying"
            fi
            sleep 5
          done
          echo "Completed $attempts attempt(s), $failures failure(s)."
          if [ "$attempts" -gt 0 ] && [ "$failures" -eq "$attempts" ]; then
            echo "::error::Every poll-once attempt in this run failed — likely a systemic issue (bad ATZMA_WORKER_SHARED_TOKEN, unreachable API, etc.), not transient noise."
            exit 1
          fi

      - name: Trigger next poll run (self-chaining heartbeat)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs unconditionally (even if the drain step above failed) so a
          # bad token or transient outage doesn't also kill the heartbeat —
          # it should keep trying to self-heal on every cycle. `schedule:`
          # is the fallback if this call itself ever fails (API outage,
          # token issue), so a single missed chain link isn't fatal.
          gh workflow run execution_poll.yml --ref "${{ github.ref_name }}"
