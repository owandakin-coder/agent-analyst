name: Monthly Retrain

# ──────────────────────────────────────────────────────────────
# Runs on the 1st of every month at 06:00 UTC (before market open).
# Also available via manual trigger (workflow_dispatch).
#
# What it does:
#   1. Snapshots the current production model for comparison
#   2. Downloads fresh historical data
#   3. Runs Optuna hyperparameter search (4 trials, scoped down — see below)
#   4. Trains the final base model (100k steps, scoped down)
#   5. Trains ensemble (3 seeds × 100k steps, scoped down)
#   6. Backtests the candidate against the snapshot and reverts it if it
#      regresses on Sharpe / drawdown / return (see promote_model.py)
#   7. Commits updated model files back to the repository
#   8. Sends Telegram notification with training results
#
# Runtime note: 4 real runs in a row failed before this scope cut existed.
# 2026-06-01 and 2026-07-01 were cancelled at the (then) 120-minute limit.
# Raising timeout-minutes to 350 (2026-08-09 fix) did NOT solve it: the next
# real run (workflow_dispatch, same day) used the full 350 minutes and was
# STILL cancelled, with the training log showing it hadn't even finished the
# original 10-trial x 50k-step Optuna phase — before touching the 500k-step
# final model or the 500k x 3 ensemble. The bottleneck is compute, not the
# timeout: a transformer-policy PPO agent on GitHub's shared CPU-only
# runners is too slow for the original budget at any timeout GitHub allows
# (360 min hard ceiling). ATZMA_TRIAL_TIMESTEPS / ATZMA_ENSEMBLE_TIMESTEPS
# below cut the step budget to ~18% of the original (config.yaml itself is
# untouched, so local/manual training keeps full quality — see
# training_pipeline.py's _env_int_override). If a run still doesn't finish
# in 350 minutes, cut these further or move training off GitHub Actions
# entirely (self-hosted runner / GPU).
# ──────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of every month, 06:00 UTC
  workflow_dispatch:
    inputs:
      optuna_trials:
        description: 'Number of Optuna trials'
        required: false
        default: '4'

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # was 120 — both real runs got cancelled mid-training at that limit

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python + pip cache ─────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Snapshot current production model ───────────────────
      # Taken BEFORE training overwrites final_model.zip, so promote_model.py
      # has something to compare the new candidate against.
      - name: Snapshot current production model
        run: |
          if [ -f models/final_model.zip ]; then
            cp models/final_model.zip models/previous_model.zip
            cp models/vec_normalize.pkl models/previous_vec_normalize.pkl
            echo "Snapshotted existing production model for comparison."
          else
            echo "No existing production model — first deploy, nothing to snapshot."
          fi

      # ── 5. Train base model ───────────────────────────────────
      - name: Train base model (Optuna + 100k steps, scoped for CI compute)
        env:
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:    https://paper-api.alpaca.markets
          ATZMA_TRIAL_TIMESTEPS:    "10000"
          ATZMA_ENSEMBLE_TIMESTEPS: "100000"
        run: |
          TRIALS=${{ github.event.inputs.optuna_trials || '4' }}
          echo "Running Optuna with $TRIALS trials..."
          python -u main.py --mode train --optuna-trials $TRIALS 2>&1 | tee train_base.log
          echo "Base model training complete."

      # ── 6. Train ensemble ─────────────────────────────────────
      - name: Train ensemble (3 seeds × 100k steps, scoped for CI compute)
        env:
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:    https://paper-api.alpaca.markets
          ATZMA_TRIAL_TIMESTEPS:    "10000"
          ATZMA_ENSEMBLE_TIMESTEPS: "100000"
        run: |
          python -u main.py --mode train_ensemble 2>&1 | tee train_ensemble.log
          echo "Ensemble training complete."

      # ── 7. Gate promotion of the new model ─────────────────────
      # Backtests the freshly trained final_model.zip against the snapshot
      # taken in step 4 on the held-out test period. If it regresses beyond
      # tolerance on Sharpe / drawdown / return, final_model.zip and
      # vec_normalize.pkl are reverted in place so the commit step below
      # ends up with no change to the production model — a bad retrain
      # never reaches live trading unattended.
      - name: Evaluate candidate vs. current production model
        id: promote
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -u promote_model.py \
            --previous models/previous_model.zip \
            --previous-norm models/previous_vec_normalize.pkl

      - name: Report promotion outcome
        run: |
          if [ "${{ steps.promote.outcome }}" = "success" ]; then
            echo "Candidate model promoted to production."
          else
            echo "Candidate model REJECTED — production model reverted to the previous snapshot."
          fi

      # ── 8. Show model files ───────────────────────────────────
      - name: List trained models
        run: |
          ls -lh models/ || echo "models/ directory not found"

      # ── 9. Commit models back to repo ─────────────────────────
      - name: Commit updated models
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add models/final_model.zip \
                  models/vec_normalize.pkl \
                  models/ensemble_0.zip \
                  models/ensemble_1.zip \
                  models/ensemble_2.zip \
                  models/ensemble_norm_0.pkl \
                  models/ensemble_norm_1.pkl \
                  models/ensemble_norm_2.pkl \
                  models/training_meta.pkl 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            MONTH=$(date '+%Y-%m')
            git commit -m "chore: monthly retrain ${MONTH} [skip ci]"
            git push
            echo "Models committed and pushed."
          fi

      # ── 10. Upload training logs ──────────────────────────────
      - name: Upload training logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-logs-${{ github.run_number }}
          path: |
            train_base.log
            train_ensemble.log
            agent_analyst.log
          retention-days: 60

      # ── 11. Telegram notification ─────────────────────────────
      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          MONTH=$(date '+%B %Y')
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            MSG="Training complete — models updated."
          else
            EMOJI="❌"
            MSG="Training FAILED — check logs in GitHub Actions."
          fi

          python - <<EOF
          import os, urllib.request, urllib.parse
          token   = os.getenv("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "")
          if token and chat_id:
              msg = (
                  f"${EMOJI} *Monthly Retrain — ${MONTH}*\n\n"
                  f"${MSG}\n\n"
                  f"Run: https://github.com/\${{ github.repository }}/actions/runs/\${{ github.run_id }}"
              )
              url  = f"https://api.telegram.org/bot{token}/sendMessage"
              data = urllib.parse.urlencode({
                  "chat_id": chat_id, "text": msg, "parse_mode": "Markdown"
              }).encode()
              try:
                  urllib.request.urlopen(url, data, timeout=10)
                  print("Telegram notification sent.")
              except Exception as e:
                  print(f"Telegram failed: {e}")
          EOF
